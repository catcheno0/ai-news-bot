name: Daily AI News Digest

on:
  # Triggered by cron-job.org (external cron) or manual dispatch
  # GitHub native schedule removed to avoid duplicate pushes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-send-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate and send AI news digest
        env:
          # All values come from GitHub Repository Secrets
          # Configure at: Settings -> Secrets and variables -> Actions -> Repository secrets

          # ============================================
          # LLM Provider Configuration
          # ============================================

          # Choose your provider: claude, deepseek, gemini, grok, or openai
          # Set LLM_PROVIDER secret to your choice (default: claude)
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}

          # API Keys (provide the one you're using)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          # Optional: Specify a model (if not set, uses provider's default)
          # Examples: claude-sonnet-4-5-20250929, deepseek-chat, deepseek-reasoner
          LLM_MODEL: ${{ secrets.LLM_MODEL }}

          # ============================================
          # Notification Configuration
          # ============================================

          # Required: Notification methods (comma-separated)
          # Default channel for this deployment
          NOTIFICATION_METHODS: wechat_official

          # Email Option A: Gmail
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          # Optional: Webhook
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

          # Optional: Language (defaults to 'en' if not set)
          # Supported: en, zh, es, fr, ja, de, ko, pt, ru, ar, hi, it, nl
          # For multiple languages, separate with commas (e.g., 'en,zh,ja')
          AI_RESPONSE_LANGUAGE: ${{ secrets.AI_RESPONSE_LANGUAGE }}

          # WeChat Official Account test account
          WECHAT_OFFICIAL_APP_ID: ${{ secrets.WECHAT_OFFICIAL_APP_ID }}
          WECHAT_OFFICIAL_APP_SECRET: ${{ secrets.WECHAT_OFFICIAL_APP_SECRET }}
          WECHAT_OFFICIAL_OPENID: ${{ secrets.WECHAT_OFFICIAL_OPENID }}
          WECHAT_OFFICIAL_TEMPLATE_ID: ${{ secrets.WECHAT_OFFICIAL_TEMPLATE_ID }}

          # Static digest pages
          PAGES_ENABLED: "true"
          PAGES_OUTPUT_DIR: public
          PAGES_SITE_URL: https://news.my-ai-news.top

        run: |
          python main.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: |
            *.log
          retention-days: 7
